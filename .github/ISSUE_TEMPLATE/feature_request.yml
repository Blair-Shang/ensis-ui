name: Feature request / 功能建议
description: Propose an idea for ensis-ui / 为 ensis-ui 提出新想法
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Discuss large API changes here before a large PR.
        较大的 API 变更请先在此讨论再开大型 PR。

        New components must follow docs/components.en.md and CONTRIBUTING.en.md
        (中文：docs/components.md、CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What host-app problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 方案
      description: API sketch, Rs* name, tokens, or behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围确认
      options:
        - label: Compatible with existing --rs-* tokens and RsConfigProvider
        - label: Does not require hosts to depend on reka-ui
        - label: Willing to add tests and a site/ demo (catalog + demos/{slug}.vue)
