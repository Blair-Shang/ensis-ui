name: Publish

# 本机推 v* 会直接跑。Release 用 Actions 令牌打的 tag 不会触发这里，改由 workflow_dispatch 拉起。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.1.1). Required when not pushing a tag.
        required: false
        type: string
      skip_npm:
        description: Skip npm publish; only create or update the GitHub Release notes
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF="${{ github.ref_name }}"
          else
            echo "Specify a tag (workflow_dispatch input) or push a v* tag." >&2
            exit 1
          fi
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.version }}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) != package.json version ($PKG)"
            exit 1
          fi

      - name: Publish to npm
        if: github.event.inputs.skip_npm != 'true'
        # Requires Granular Access Token with publish + "Bypass two-factor authentication".
        # Do NOT use a one-time OTP secret: codes expire in ~30s and break automated releases.
        # 正式版打 dist-tag latest；带连字符的预发布打 next，避免业务流水线误跟。
        # --provenance 依赖 permissions.id-token，在 npm 生成签名证明。
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          if [[ "$VER" == *-* ]]; then
            pnpm publish --access public --no-git-checks --tag next --provenance
          else
            pnpm publish --access public --no-git-checks --tag latest --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog notes
        run: node .github/scripts/changelog-notes.mjs "${{ steps.meta.outputs.version }}" release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ensis-ui ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
