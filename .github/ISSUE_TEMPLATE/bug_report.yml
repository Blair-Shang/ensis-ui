name: Bug report / 缺陷报告
description: Report a defect in ensis-ui / 报告 ensis-ui 中的缺陷
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Search existing Issues first.
        感谢反馈。请先搜索是否已有相同 Issue。

        Security issues: follow [SECURITY.md](../SECURITY.md). Do not use this form.
        安全漏洞请按 SECURITY.md 私下报告，不要用本表单。
  - type: textarea
    id: describe
    attributes:
      label: What happened / 问题描述
      description: What went wrong, in one paragraph.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Minimal steps, a repo, or a docs-site snippet. Not the playground unless this is a visual-regression bug.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 期望行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ensis-ui version
      placeholder: "1.3.8"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / 环境
      placeholder: "Vue 3.5.x, Vite 5.x, Chrome / Electron …"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra / 补充
      description: Screenshots, console logs, related components (RsTable, RsDialog, …).
